name: overhaul-storage-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/overhaul-storage-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply and verify repo-local storage slice
        shell: bash
        run: |
          git show HEAD^:.github/workflows/overhaul-storage-once.yml > /tmp/previous.yml
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/previous.yml').read_text().splitlines()
          out = []
          capturing = False
          for line in lines:
              if not capturing and line == '        run: |':
                  capturing = True
                  continue
              if not capturing:
                  continue
              if line.startswith('      - name: Commit verified storage overhaul'):
                  break
              if line.startswith('          '):
                  line = line[10:]
              if line == 'cargo fmt --all':
                  break
              out.append(line)
          script = '\n'.join(out).rstrip() + '\n'
          assert 'Path("tests/managed_default.rs")' in script
          assert 'storage.write_text(text)' in script
          Path('/tmp/apply-storage.sh').write_text(script)
          PY
          bash /tmp/apply-storage.sh

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/storage.rs')
          text = path.read_text()
          patterns = [
              r'\n    pub fn managed\(\) -> Result<Self> \{\n        Ok\(Self::Managed\(ManagedLayout::resolve\(\)\?\)\)\n    \}\n',
              r'\n    /// The managed layout this router uses\. Exact-file routers have none\.\n    pub fn managed_layout\(&self\) -> &ManagedLayout \{\n        match self \{\n            Self::Managed\(layout\) => layout,\n            Self::Exact\(_\) => panic!\("managed_layout on an exact-file router"\),\n        \}\n    \}\n',
          ]
          for pattern in patterns:
              text, count = re.subn(pattern, '\n', text, count=1)
              assert count == 1, f'dead helper removal count: {count}'
          path.write_text(text)
          PY

          cargo fmt --all
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          git diff --check
      - name: Commit verified storage overhaul
        shell: bash
        run: |
          rm .github/workflows/overhaul-storage-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: make mem storage repo-local"
          git push origin HEAD:main
