name: fix-migration-lock-once

on:
  push:
    branches: ['agent/lean-core']
    paths:
      - .github/workflows/fix-migration-lock-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply migration locking
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for filename in ['migrations/schema.sql', 'migrations/0007_lean_core.sql']:
              path = Path(filename)
              text = path.read_text()
              assert text.startswith('BEGIN IMMEDIATE;\n\n'), filename
              assert text.endswith('COMMIT;\n'), filename
              path.write_text(text[len('BEGIN IMMEDIATE;\n\n'):-len('COMMIT;\n')])

          path = Path('src/store.rs')
          text = path.read_text()
          old = '''    fn migrate(&self) -> Result<()> {
        let version = self.schema_version()?;
        if version > SCHEMA_VERSION {
            bail!(
                "database schema version {version} is newer than supported version {SCHEMA_VERSION}"
            );
        }
        match version {
            0 => self.connection.execute_batch(include_str!("../migrations/schema.sql"))?,
            6 => self
                .connection
                .execute_batch(include_str!("../migrations/0007_lean_core.sql"))?,
            7 => {}
            1..=5 => bail!(
                "database schema version {version} is from an unsupported pre-1.0 build; upgrade it to v6 with the previous mem build first"
            ),
            _ => unreachable!(),
        }
        let version = self.schema_version()?;
        if version != SCHEMA_VERSION {
            bail!("failed to migrate database to schema version {SCHEMA_VERSION}; got {version}");
        }
        Ok(())
    }
'''
          new = '''    fn migrate(&self) -> Result<()> {
        self.connection.execute_batch("BEGIN IMMEDIATE;")?;
        let result = (|| -> Result<()> {
            let version = self.schema_version()?;
            if version > SCHEMA_VERSION {
                bail!(
                    "database schema version {version} is newer than supported version {SCHEMA_VERSION}"
                );
            }
            match version {
                0 => self.connection.execute_batch(include_str!("../migrations/schema.sql"))?,
                6 => self
                    .connection
                    .execute_batch(include_str!("../migrations/0007_lean_core.sql"))?,
                7 => {}
                1..=5 => bail!(
                    "database schema version {version} is from an unsupported pre-1.0 build; upgrade it to v6 with the previous mem build first"
                ),
                _ => unreachable!(),
            }
            let version = self.schema_version()?;
            if version != SCHEMA_VERSION {
                bail!("failed to migrate database to schema version {SCHEMA_VERSION}; got {version}");
            }
            Ok(())
        })();
        match result {
            Ok(()) => {
                self.connection.execute_batch("COMMIT;")?;
                Ok(())
            }
            Err(error) => {
                let _ = self.connection.execute_batch("ROLLBACK;");
                Err(error)
            }
        }
    }
'''
          assert old in text, 'migrate function changed unexpectedly'
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo test --bin mem store::tests::concurrent_remembers_do_not_lose_writes
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-migration-lock-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: serialize schema migration"
          git pull --rebase origin agent/lean-core
          git push origin HEAD:agent/lean-core
