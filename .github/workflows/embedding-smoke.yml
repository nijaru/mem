name: embedding-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/embedding-smoke.yml
      - Cargo.toml
      - src/embedding.rs
      - src/embedding_worker.rs
      - src/id_resolve.rs
      - src/main.rs
      - src/storage.rs
      - src/vector_search.rs

permissions:
  contents: read

jobs:
  embed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      MEM_MODEL_CACHE: ${{ github.workspace }}/.model-cache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: fastembed-5.3.0-bge-small-en-v1.5-q-${{ runner.os }}-${{ runner.arch }}
      - name: Build
        run: cargo build --release
      - name: Run embedding and semantic retrieval smoke
        shell: bash
        run: |
          set -euo pipefail
          db="$RUNNER_TEMP/mem-smoke.db"
          target="Each Git worktree keeps an independent continuation checkpoint."
          query="separate resume state for parallel repository checkouts"

          target/release/mem --db "$db" remember "$target" \
            --kind decision --global --source-type smoke
          target/release/mem --db "$db" remember \
            "Embedding workers retry failed inference after a delay." \
            --kind procedure --global --source-type smoke
          target/release/mem --db "$db" remember \
            "Deleted memories are excluded from active search results." \
            --kind fact --global --source-type smoke
          target/release/mem --db "$db" remember \
            "Semantic memories retain provenance evidence for their source." \
            --kind fact --global --source-type smoke

          run_json="$(target/release/mem --json --db "$db" index run -n 4)"
          printf '%s\n' "$run_json"
          RUN_JSON="$run_json" python3 - <<'PY'
          import json
          import os

          result = json.loads(os.environ["RUN_JSON"])
          assert result["claimed"] == 4, result
          assert result["eligible"] == 4, result
          assert result["committed"] == 4, result
          assert result["stale"] == 0, result
          assert result["retried"] == 0, result
          PY

          status_json="$(target/release/mem --json --db "$db" index status)"
          printf '%s\n' "$status_json"
          STATUS_JSON="$status_json" python3 - <<'PY'
          import json
          import os

          status = json.loads(os.environ["STATUS_JSON"])
          assert status["pending"] == 0, status
          assert status["running"] == 0, status
          PY

          lexical_json="$(target/release/mem --json --db "$db" search "$query" --global -n 4)"
          printf '%s\n' "$lexical_json"
          LEXICAL_JSON="$lexical_json" TARGET="$target" python3 - <<'PY'
          import json
          import os

          # Lexical search is bm25-ranked OR matching: partial term matches
          # stay visible. The control demonstrates the semantic tier's value —
          # the target memory shares no query term, so it must not appear
          # among lexical hits even though weaker partial matches may.
          hits = json.loads(os.environ["LEXICAL_JSON"])
          texts = [hit["memory"]["text"] for hit in hits]
          assert os.environ["TARGET"] not in texts, hits
          PY

          semantic_json="$(target/release/mem --json --db "$db" search "$query" --semantic --global -n 4)"
          printf '%s\n' "$semantic_json"
          SEMANTIC_JSON="$semantic_json" TARGET="$target" python3 - <<'PY'
          import json
          import os

          hits = json.loads(os.environ["SEMANTIC_JSON"])
          assert len(hits) == 4, hits
          assert hits[0]["memory"]["text"] == os.environ["TARGET"], hits
          assert hits[0]["score"] > hits[1]["score"], hits
          PY
