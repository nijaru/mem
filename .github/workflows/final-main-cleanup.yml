name: final-main-cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/final-main-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    env:
      MEM_MODEL_CACHE: .model-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: mem-fastembed-v1
      - name: Apply cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          store = Path('src/store.rs')
          text = store.read_text()
          start = text.index('    pub fn recall(')
          end = text.index('    pub fn get(', start)
          store.write_text(text[:start] + text[end:])

          main = Path('src/main.rs')
          text = main.read_text()

          start = text.index('            for hit in hits {')
          end = text.index('            let output = ContextOutput', start)
          block = text[start:end]
          if '!memories.is_empty() && ' not in block or 'break;' not in block:
              raise SystemExit('context budget block shape changed')
          block = block.replace('!memories.is_empty() && ', '', 1).replace('break;', 'continue;', 1)
          text = text[:start] + block + text[end:]

          old_fallback = '    store.recall(query, limit)\n'
          if old_fallback not in text:
              raise SystemExit('recall fallback not found')
          text = text.replace(old_fallback, '    store.search(query, limit)\n', 1)

          function = text.index('fn database_path(')
          root_start = text.index('    if let Some(root) = crate::workspace::repo_root() {', function)
          first_loop = text.index('    for ancestor in cwd.ancestors() {', root_start)
          second_loop = text.index('    for ancestor in cwd.ancestors() {', first_loop + 1)
          replacement = '''    if let Some(root) = crate::workspace::repo_root() {
              return Ok(root.join(".mem").join("mem.db"));
          }
          '''
          text = text[:root_start] + replacement + text[second_loop:]
          main.write_text(text)

          tests = Path('tests/repo_local.rs')
          text = tests.read_text()
          addition = r'''

          #[test]
          fn nested_mem_directory_does_not_shadow_git_root_store() {
              let root = temp_dir();
              let git = Command::new("git")
                  .args(["init", "-q", root.to_str().unwrap()])
                  .output()
                  .unwrap();
              assert!(git.status.success());
              assert!(run(&root, &["init"]).status.success());

              let nested = root.join("src/deep");
              std::fs::create_dir_all(nested.join(".mem")).unwrap();
              let value = run_json(&nested, &["status"]);
              assert_eq!(
                  value["database"],
                  root.join(".mem/mem.db").display().to_string()
              );
              std::fs::remove_dir_all(root).unwrap();
          }

          #[test]
          fn context_max_bytes_is_a_hard_bound() {
              let cwd = temp_dir();
              run_json(
                  &cwd,
                  &["remember", "oversized memory payload", "--source-type", "test"],
              );
              let value = run_json(&cwd, &["context", "oversized", "--max-bytes", "4"]);
              assert_eq!(value["memories"].as_array().map(Vec::len), Some(0));
              std::fs::remove_dir_all(cwd).unwrap();
          }
          '''
          if 'fn context_max_bytes_is_a_hard_bound()' in text:
              raise SystemExit('cleanup tests already present')
          tests.write_text(text + addition)

          readme = Path('README.md')
          text = readme.read_text()
          old = 'Each project owns one SQLite database at `.mem/mem.db`.'
          new = 'Each Git project owns one SQLite database at the repository-root `.mem/mem.db`.'
          if old not in text:
              raise SystemExit('README storage sentence not found')
          readme.write_text(text.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Release build
        run: cargo build --release
      - name: Retrieval evaluation
        run: |
          cargo test --test retrieval_eval -- --ignored --nocapture
          cargo test --test real_corpus_eval -- --ignored --nocapture
          cargo test --test heldout_eval -- --ignored --nocapture
      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store.rs src/main.rs tests/repo_local.rs README.md
          git commit -m "refactor: tighten repo-local context contracts"
          git push origin HEAD:main
