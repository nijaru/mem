name: finalize-lean-core

on:
  push:
    branches:
      - agent/lean-core
    paths:
      - .github/workflows/finalize-lean-core.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-22.04
    env:
      MEM_MODEL_CACHE: .model-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: lean-core-fastembed-v1
      - name: Materialize final source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/lean-core-verify.yml').read_text()
          marker = '      - name: Prepare final tree and v6 migration fixture\n'
          start = text.index(marker)
          run_start = text.index('        run: |\n', start) + len('        run: |\n')
          end = text.index('      - name: Format\n', run_start)
          block = text[run_start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              else:
                  lines.append(line)
          Path('/tmp/prepare-lean-core.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/prepare-lean-core.sh
      - name: Format
        run: cargo fmt --all
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Release build
        run: cargo build --release
      - name: Verify v6 migration
        shell: bash
        run: |
          set -euo pipefail
          status="$(target/release/mem --json --db /tmp/mem-v6.db status)"
          STATUS="$status" python3 - <<'PY'
          import json, os
          status = json.loads(os.environ['STATUS'])
          assert status['schema_version'] == 7, status
          assert status['active'] == 1, status
          PY
          memory="$(target/release/mem --json --db /tmp/mem-v6.db get old-1)"
          MEMORY="$memory" python3 - <<'PY'
          import json, os
          memory = json.loads(os.environ['MEMORY'])
          assert memory['text'] == 'preserved v6 memory', memory
          assert memory['source_type'] == 'git', memory
          assert memory['source_ref'] == 'abc123', memory
          PY
          state="$(target/release/mem --json --db /tmp/mem-v6.db state show --workspace branch:main)"
          STATE="$state" python3 - <<'PY'
          import json, os
          state = json.loads(os.environ['STATE'])
          assert state['session'] == 'session-1', state
          assert state['goal'] == 'migrate', state
          assert state['checkpoint'] == 'v6 checkpoint', state
          PY
      - name: Retrieval evaluation
        run: |
          cargo test --test retrieval_eval -- --ignored --nocapture
          cargo test --test real_corpus_eval -- --ignored --nocapture
          cargo test --test heldout_eval -- --ignored --nocapture
      - name: Create verified final commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-lean-core.yml .github/workflows/lean-core-verify.yml .github/workflows/fix-migration-lock-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: simplify mem to its durable core"
          git push origin HEAD:agent/lean-core
