                  }
                  let output = ContextOutput { project, state, memories };
                  if cli.json {
                      print_json(&output)?;
                  } else {
                      print_context(&output);
                  }
              }
              Command::Remember'''.replace('\n              ', '\n'), text, count=1, flags=re.S)
          assert n == 1, f'context branch {n}'

          # New writes use one compatibility sentinel until the memory table is rebuilt.
          text, n = re.subn(
              r'        Command::Remember\(command\) => \{.*?\n        \}\n        Command::Correct',
              '''        Command::Remember(command) => {
                  let mut store = router.write_store()?;
                  let memory = store.remember(NewMemory {
                      text: command.text,
                      kind: command.kind.unwrap_or_else(|| "fact".to_owned()),
                      project_id: Some("local".to_owned()),
                      actor: command.actor.unwrap_or_else(|| "agent".to_owned()),
