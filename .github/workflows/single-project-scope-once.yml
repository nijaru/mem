name: single-project-scope-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/single-project-scope-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Collapse logical project scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Project context now describes only the physical repository boundary
          # and workspace. Git remotes are no longer a memory routing key.
          Path('src/project.rs').write_text(r'''use std::path::PathBuf;
          use std::process::Command;

          use anyhow::{Result, bail};
          use serde::Serialize;

          #[derive(Debug, Clone, Serialize)]
          pub struct ProjectContext {
              pub workspace_id: String,
              pub root: Option<PathBuf>,
          }

          impl ProjectContext {
              pub fn detect(workspace_override: Option<&str>) -> Result<Self> {
                  let root = git_output(&["rev-parse", "--show-toplevel"]).map(PathBuf::from);
                  let workspace_id = match workspace_override {
                      Some(workspace) => validate_override(workspace, "workspace")?.to_owned(),
                      None => detect_workspace(),
                  };
                  Ok(Self { workspace_id, root })
              }
          }

          fn detect_workspace() -> String {
              if let Some(branch) = git_output(&["symbolic-ref", "--quiet", "--short", "HEAD"]) {
                  return format!("branch:{branch}");
              }
              if let Some(commit) = git_output(&["rev-parse", "--short=12", "HEAD"]) {
                  return format!("detached:{commit}");
              }
              "default".to_owned()
          }

          fn git_output(args: &[&str]) -> Option<String> {
              let output = Command::new("git").args(args).output().ok()?;
              if !output.status.success() {
                  return None;
              }
              let value = String::from_utf8(output.stdout).ok()?;
              let value = value.trim();
              (!value.is_empty()).then(|| value.to_owned())
          }

          fn validate_override<'a>(value: &'a str, kind: &str) -> Result<&'a str> {
              let value = value.trim();
              if value.is_empty() {
                  bail!("{kind} identifier cannot be empty");
              }
              Ok(value)
          }

          #[cfg(test)]
          mod tests {
              use super::ProjectContext;

              #[test]
              fn workspace_override_is_validated_without_project_identity() {
                  let context = ProjectContext::detect(Some("worktree:feature")).expect("context");
                  assert_eq!(context.workspace_id, "worktree:feature");
                  assert!(ProjectContext::detect(Some("   ")).is_err());
              }
          }
          '''.replace('\n          ', '\n').lstrip())

          # Workspace state is already physically inside one project DB, so its
          # key becomes workspace-only. Preserve the newest row when old DBs
          # contain the same workspace under multiple historical project IDs.
          Path('migrations/0006_workspace_local.sql').write_text(r'''BEGIN IMMEDIATE;

          CREATE TABLE workspace_state_v6 (
              workspace_id TEXT PRIMARY KEY NOT NULL,
              last_session_id TEXT,
              active_goal TEXT,
              active_task_ref TEXT,
              checkpoint TEXT,
              updated_at INTEGER NOT NULL
          );

          INSERT INTO workspace_state_v6 (
              workspace_id, last_session_id, active_goal, active_task_ref, checkpoint, updated_at
          )
          SELECT
              ws.workspace_id, ws.last_session_id, ws.active_goal, ws.active_task_ref,
              ws.checkpoint, ws.updated_at
          FROM workspace_state AS ws
          WHERE ws.rowid = (
              SELECT newer.rowid
              FROM workspace_state AS newer
              WHERE newer.workspace_id = ws.workspace_id
              ORDER BY newer.updated_at DESC, newer.rowid DESC
              LIMIT 1
          );

          DROP TABLE workspace_state;
          ALTER TABLE workspace_state_v6 RENAME TO workspace_state;

          PRAGMA user_version = 6;
          COMMIT;
          '''.replace('\n          ', '\n').lstrip())

          # Single-store router: no project arguments remain in routing APIs.
          Path('src/storage.rs').write_text(r'''//! Single-store routing for the project-local SQLite database.

          use std::path::{Path, PathBuf};

          use anyhow::{Result, bail};
          use serde::Serialize;

          use crate::embedding_worker::{EMBEDDING_MODEL_ID, EmbeddingRunOptions};
          use crate::index_job::IndexJobStats;
          use crate::store::{SearchHit, Store, WorkspaceState};
          use crate::vector_search::SemanticSearchHit;

          #[derive(Debug, Clone)]
          pub struct StorageRouter {
              path: PathBuf,
          }

          impl StorageRouter {
              pub fn exact(path: PathBuf) -> Self {
                  Self { path }
              }

              pub fn path(&self) -> &Path {
                  &self.path
              }

              pub fn write_store(&self) -> Result<Store> {
                  Store::open(&self.path)
              }

              fn read_store(&self) -> Result<Option<Store>> {
                  Store::open_existing(&self.path)
              }
          }

          pub fn routed_resolve_memory(
              router: &StorageRouter,
              id_or_prefix: &str,
          ) -> Result<(Store, String)> {
              resolve_id(router, id_or_prefix, "memory", |store, candidate| {
                  store.memory_id_candidates(candidate)
              })
          }

          fn resolve_id<F>(
              router: &StorageRouter,
              id_or_prefix: &str,
              kind: &str,
              candidates: F,
          ) -> Result<(Store, String)>
          where
              F: FnOnce(&Store, &str) -> Result<Vec<String>>,
          {
              let candidate = id_or_prefix.trim();
              if candidate.is_empty() {
                  bail!("{kind} ID cannot be empty");
              }
              let Some(store) = router.read_store()? else {
                  bail!("{kind} not found: {candidate}");
              };
              let matches = candidates(&store, candidate)?;
              if let Some(exact) = matches.iter().find(|id| id.as_str() == candidate) {
                  return Ok((store, exact.clone()));
              }
              match matches.as_slice() {
                  [] => bail!("{kind} not found: {candidate}"),
                  [id] => Ok((store, id.clone())),
                  _ => bail!("ambiguous {kind} ID prefix: {candidate}"),
              }
          }

          pub fn routed_recall_hits(
              router: &StorageRouter,
              query: &str,
              limit: usize,
          ) -> Result<Vec<SearchHit>> {
              let Some(store) = router.read_store()? else {
                  return Ok(Vec::new());
              };
              crate::recall_hits(&store, query, limit)
          }

          pub fn routed_lexical_search(
              router: &StorageRouter,
              query: &str,
              limit: usize,
          ) -> Result<Vec<SearchHit>> {
              let Some(store) = router.read_store()? else {
                  return Ok(Vec::new());
              };
              store.search(query, limit)
          }

          pub fn routed_semantic_search(
              router: &StorageRouter,
              query_vector: &[f32],
              limit: usize,
          ) -> Result<Vec<SemanticSearchHit>> {
              let Some(store) = router.read_store()? else {
                  return Ok(Vec::new());
              };
              store.semantic_search_by_vector(query_vector, EMBEDDING_MODEL_ID, limit)
          }

          pub fn routed_workspace_state(
              router: &StorageRouter,
              workspace_id: &str,
          ) -> Result<Option<WorkspaceState>> {
              let Some(store) = router.read_store()? else {
                  return Ok(None);
              };
              store.workspace_state(workspace_id)
          }

          #[derive(Debug, Serialize)]
          pub struct RoutedRunStats {
              pub model: &'static str,
              pub cache_dir: String,
              pub stores: usize,
              pub claimed: usize,
              pub eligible: usize,
              pub committed: usize,
              pub stale: usize,
              pub retried: usize,
          }

          pub fn routed_run_index(
              router: &StorageRouter,
              options: EmbeddingRunOptions,
          ) -> Result<RoutedRunStats> {
              let mut stats = RoutedRunStats {
                  model: EMBEDDING_MODEL_ID,
                  cache_dir: options.cache_dir.display().to_string(),
                  stores: 1,
                  claimed: 0,
                  eligible: 0,
                  committed: 0,
                  stale: 0,
                  retried: 0,
              };
              let Some(mut store) = router.read_store()? else {
                  return Ok(stats);
              };
              let run = store.run_embedding_jobs(options)?;
              stats.claimed = run.claimed;
              stats.eligible = run.eligible;
              stats.committed = run.committed;
              stats.stale = run.stale;
              stats.retried = run.retried;
              Ok(stats)
          }

          pub fn routed_index_stats(router: &StorageRouter) -> Result<IndexJobStats> {
              let Some(store) = router.read_store()? else {
                  return Ok(IndexJobStats {
                      pending: 0,
                      running: 0,
                  });
              };
              store.index_job_stats()
          }
          '''.replace('\n          ', '\n').lstrip())

          # Store: retrieval spans every active memory in this one project DB;
          # continuation state is keyed only by workspace.
          path = Path('src/store.rs')
          text = path.read_text()
          text = text.replace('const SCHEMA_VERSION: i64 = 5;', 'const SCHEMA_VERSION: i64 = 6;')
          text = text.replace('    pub project_id: String,\n    pub workspace_id: String,', '    pub workspace_id: String,', 2)
          text = text.replace('    pub project_id: String,\n    pub workspace_id: String,', '    pub workspace_id: String,')

          text, n = re.subn(
              r'    pub fn search\(\n        &self,\n        query: &str,\n        project_id: Option<&str>,\n        limit: usize,\n    \) -> Result<Vec<SearchHit>> \{\n        self\.search_fts\(&crate::id_resolve::fts_query\(query\)\?, project_id, limit\)\n    \}',
              '    pub fn search(&self, query: &str, limit: usize) -> Result<Vec<SearchHit>> {\n        self.search_fts(&crate::id_resolve::fts_query(query)?, limit)\n    }', text, count=1)
          assert n == 1, f'search signature: {n}'
          text, n = re.subn(
              r'    pub fn recall\(\n        &self,\n        query: &str,\n        project_id: Option<&str>,\n        limit: usize,\n    \) -> Result<Vec<SearchHit>> \{\n        self\.search_fts\(&crate::id_resolve::fts_query\(query\)\?, project_id, limit\)\n    \}',
              '    pub fn recall(&self, query: &str, limit: usize) -> Result<Vec<SearchHit>> {\n        self.search_fts(&crate::id_resolve::fts_query(query)?, limit)\n    }', text, count=1)
          assert n == 1, f'recall signature: {n}'

          text, n = re.subn(
              r'    pub fn workspace_state\(.*?\n    pub fn set_workspace_state',
              '''    pub fn workspace_state(&self, workspace_id: &str) -> Result<Option<WorkspaceState>> {
                  validate_identity(workspace_id, "workspace")?;
                  Ok(self
                      .connection
                      .query_row(
                          "SELECT workspace_id, last_session_id, active_goal, active_task_ref, checkpoint, updated_at\n\\
                           FROM workspace_state\n\\
                           WHERE workspace_id = ?1",
                          [workspace_id],
                          workspace_state_from_row,
                      )
                      .optional()?)
              }

              pub fn set_workspace_state''', text, count=1, flags=re.S)
          assert n == 1, f'workspace_state: {n}'

          text, n = re.subn(
              r'    pub fn set_workspace_state\(&self, input: NewWorkspaceState\) -> Result<WorkspaceState> \{.*?\n    \}\n\n    /// Atomically update',
              '''    pub fn set_workspace_state(&self, input: NewWorkspaceState) -> Result<WorkspaceState> {
                  validate_identity(&input.workspace_id, "workspace")?;
                  validate_optional(&input.last_session_id, "session")?;
                  validate_optional(&input.active_goal, "goal")?;
                  validate_optional(&input.active_task_ref, "task")?;
                  validate_optional(&input.checkpoint, "checkpoint")?;

                  let now = unix_millis()?;
                  self.connection.execute(
                      "INSERT INTO workspace_state (\n\\
                           workspace_id, last_session_id, active_goal, active_task_ref, checkpoint, updated_at\n\\
                       ) VALUES (?1, ?2, ?3, ?4, ?5, ?6)\n\\
                       ON CONFLICT(workspace_id) DO UPDATE SET\n\\
                           last_session_id = excluded.last_session_id,\n\\
                           active_goal = excluded.active_goal,\n\\
                           active_task_ref = excluded.active_task_ref,\n\\
                           checkpoint = excluded.checkpoint,\n\\
                           updated_at = excluded.updated_at",
                      params![
                          &input.workspace_id,
                          &input.last_session_id,
                          &input.active_goal,
                          &input.active_task_ref,
                          &input.checkpoint,
                          now
                      ],
                  )?;

                  self.workspace_state(&input.workspace_id)?
                      .context("workspace state disappeared after write")
              }

              /// Atomically update''', text, count=1, flags=re.S)
          assert n == 1, f'set state: {n}'

          text, n = re.subn(
              r'    pub fn patch_workspace_state\(&self, input: NewWorkspaceStatePatch\) -> Result<WorkspaceState> \{.*?\n    \}\n\n    pub fn clear_workspace_state',
              '''    pub fn patch_workspace_state(&self, input: NewWorkspaceStatePatch) -> Result<WorkspaceState> {
                  validate_identity(&input.workspace_id, "workspace")?;
                  validate_optional(&input.last_session_id, "session")?;
                  validate_optional(&input.active_goal, "goal")?;
                  validate_optional(&input.active_task_ref, "task")?;
                  validate_optional(&input.checkpoint, "checkpoint")?;
                  for field in &input.clear_fields {
                      if !PATCHABLE_FIELDS.contains(&field.as_str()) {
                          bail!("unknown state field: {field}");
                      }
                  }

                  let now = unix_millis()?;
                  self.connection.execute(
                      "INSERT INTO workspace_state (\n\\
                           workspace_id, last_session_id, active_goal, active_task_ref, checkpoint, updated_at\n\\
                       ) VALUES (?1, ?2, ?3, ?4, ?5, ?6)\n\\
                       ON CONFLICT(workspace_id) DO UPDATE SET\n\\
                           last_session_id = COALESCE(?2, CASE WHEN ?7 THEN NULL ELSE last_session_id END),\n\\
                           active_goal = COALESCE(?3, CASE WHEN ?8 THEN NULL ELSE active_goal END),\n\\
                           active_task_ref = COALESCE(?4, CASE WHEN ?9 THEN NULL ELSE active_task_ref END),\n\\
                           checkpoint = COALESCE(?5, CASE WHEN ?10 THEN NULL ELSE checkpoint END),\n\\
                           updated_at = ?6",
                      params![
                          &input.workspace_id,
                          &input.last_session_id,
                          &input.active_goal,
                          &input.active_task_ref,
                          &input.checkpoint,
                          now,
                          input.clear_fields.iter().any(|field| field == "session"),
                          input.clear_fields.iter().any(|field| field == "goal"),
                          input.clear_fields.iter().any(|field| field == "task"),
                          input.clear_fields.iter().any(|field| field == "checkpoint"),
                      ],
                  )?;

                  self.workspace_state(&input.workspace_id)?
                      .context("workspace state disappeared after write")
              }

              pub fn clear_workspace_state''', text, count=1, flags=re.S)
          assert n == 1, f'patch state: {n}'

          text, n = re.subn(
              r'    pub fn clear_workspace_state\(&self, project_id: &str, workspace_id: &str\) -> Result<bool> \{.*?\n    \}\n\n    fn search_fts',
              '''    pub fn clear_workspace_state(&self, workspace_id: &str) -> Result<bool> {
                  validate_identity(workspace_id, "workspace")?;
                  Ok(self.connection.execute(
                      "DELETE FROM workspace_state WHERE workspace_id = ?1",
                      [workspace_id],
                  )? > 0)
              }

              fn search_fts''', text, count=1, flags=re.S)
          assert n == 1, f'clear state: {n}'

          text, n = re.subn(
              r'    fn search_fts\(.*?\n        Ok\(hits\)\n    \}\n\n    fn migrate',
              '''    fn search_fts(&self, query: &str, limit: usize) -> Result<Vec<SearchHit>> {
                  let limit = i64::try_from(limit)?;
                  let mut statement = self.connection.prepare(
                      "SELECT m.id, m.scope, m.project_id, m.kind, m.text, m.actor, m.status,\n\\
                              m.created_at, m.updated_at, m.deleted_at, bm25(memories_fts)\n\\
                       FROM memories_fts\n\\
                       JOIN memories AS m ON m.rowid = memories_fts.rowid\n\\
                       WHERE memories_fts MATCH ?1\n\\
                         AND m.status = 'active'\n\\
                       ORDER BY bm25(memories_fts), m.updated_at DESC\n\\
                       LIMIT ?2",
                  )?;
                  let rows = statement.query_map(params![query, limit], search_hit_from_row)?;
                  let mut hits = Vec::new();
                  for row in rows {
                      hits.push(row?);
                  }
                  Ok(hits)
              }

              fn migrate''', text, count=1, flags=re.S)
          assert n == 1, f'search_fts: {n}'

          marker = '''        if self.schema_version()? == 4 {
                      apply(
                          include_str!("../migrations/0005_episode_vectors_disabled.sql"),
                          4,
                      )?;
                  }
          '''.replace('          ', '')
          assert marker in text
          text = text.replace(marker, marker + '''        if self.schema_version()? == 5 {
                      apply(include_str!("../migrations/0006_workspace_local.sql"), 5)?;
                  }
          '''.replace('          ', ''), 1)
          text = text.replace('        project_id: row.get(0)?,\n        workspace_id: row.get(1)?,\n        last_session_id: row.get(2)?,\n        active_goal: row.get(3)?,\n        active_task_ref: row.get(4)?,\n        checkpoint: row.get(5)?,\n        updated_at: row.get(6)?,',
                              '        workspace_id: row.get(0)?,\n        last_session_id: row.get(1)?,\n        active_goal: row.get(2)?,\n        active_task_ref: row.get(3)?,\n        checkpoint: row.get(4)?,\n        updated_at: row.get(5)?,')
          text = text.replace('assert_eq!(reopened.stats().expect("read stats").schema_version, 5);',
                              'assert_eq!(reopened.stats().expect("read stats").schema_version, 6);')
          # Workspace tests: project IDs no longer participate in API or rows.
          text = re.sub(r'\n\s*project_id: "github\.com/nijaru/mem"\.to_owned\(\),', '', text)
          text = text.replace('.workspace_state("github.com/nijaru/mem", "branch:main")', '.workspace_state("branch:main")')
          text = text.replace('.clear_workspace_state("github.com/nijaru/mem", "branch:main")', '.clear_workspace_state("branch:main")')
          path.write_text(text)

          # Vector search now spans all active memories in the local DB.
          path = Path('src/vector_search.rs')
          text = path.read_text()
          text, n = re.subn(
              r'    /// Whether every active memory visible in this scope.*?\n    pub fn semantic_search_by_vector',
              '''    /// Whether every active memory in this local project store has a current-model vector.
              pub fn has_complete_coverage(&self, model: &str) -> Result<bool> {
                  if model.trim().is_empty() {
                      bail!("embedding model identifier cannot be empty");
                  }
                  let covered: i64 = self.connection.query_row(
                      "SELECT COUNT(*)\n
                       FROM memories AS m\n
                       WHERE m.status = 'active'\n
                         AND EXISTS (\n
                             SELECT 1 FROM embeddings AS e\n
                             WHERE e.entity_type = 'memory'\n
                               AND e.entity_id = m.id\n
                               AND e.model = ?1\n
                         )",
                      [model],
                      |row| row.get(0),
                  )?;
                  let visible: i64 = self.connection.query_row(
                      "SELECT COUNT(*) FROM memories WHERE status = 'active'",
                      [],
                      |row| row.get(0),
                  )?;
                  Ok(covered == visible)
              }

              pub fn semantic_search_by_vector'''.replace('\n              ', '\n'), text, count=1, flags=re.S)
          assert n == 1, f'coverage method: {n}'
          text, n = re.subn(
              r'    pub fn semantic_search_by_vector\(.*?\n        Ok\(hits\)\n    \}\n\}',
              '''    pub fn semantic_search_by_vector(
                  &self,
                  query_vector: &[f32],
                  model: &str,
                  limit: usize,
              ) -> Result<Vec<SemanticSearchHit>> {
                  if model.trim().is_empty() {
                      bail!("embedding model identifier cannot be empty");
                  }
                  if limit == 0 {
                      bail!("semantic search limit must be greater than zero");
                  }
                  let query = normalize_query(query_vector)?;
                  let mut statement = self.connection.prepare(
                      "SELECT m.id, m.scope, m.project_id, m.kind, m.text, m.actor, m.status,\n\\
                              m.created_at, m.updated_at, m.deleted_at, e.dimensions, e.vector\n\\
                       FROM embeddings AS e\n\\
                       JOIN memories AS m ON m.id = e.entity_id\n\\
                       WHERE e.entity_type = 'memory'\n\\
                         AND e.model = ?1\n\\
                         AND m.status = 'active'",
                  )?;
                  let rows = statement.query_map([model], vector_candidate_from_row)?;
                  let mut candidates = Vec::new();
                  for row in rows {
                      candidates.push(row?);
                  }

                  let mut hits = Vec::with_capacity(candidates.len());
                  for candidate in candidates {
                      let dimensions = usize::try_from(candidate.dimensions)?;
                      if dimensions != query.len() {
                          bail!(
                              "embedding dimension mismatch for {}: stored {}, query {}",
                              candidate.memory.id,
                              dimensions,
                              query.len()
                          );
                      }
                      let vector = decode_vector(&candidate.vector, dimensions, &candidate.memory.id)?;
                      let score = query
                          .iter()
                          .zip(vector.iter())
                          .map(|(left, right)| f64::from(*left) * f64::from(*right))
                          .sum();
                      hits.push(SemanticSearchHit {
                          memory: candidate.memory,
                          score,
                      });
                  }
                  hits.sort_by(|left, right| {
                      right
                          .score
                          .total_cmp(&left.score)
                          .then_with(|| right.memory.updated_at.cmp(&left.memory.updated_at))
                          .then_with(|| left.memory.id.cmp(&right.memory.id))
                  });
                  hits.truncate(limit);
                  Ok(hits)
              }
              }'''.replace('\n              ', '\n'), text, count=1, flags=re.S)
          assert n == 1, f'semantic method: {n}'

          # Replace scope-specific vector tests with single-store invariants.
          text, n = re.subn(r'#\[cfg\(test\)\]\nmod tests \{.*\Z', r'''#[cfg(test)]
          mod tests {
              use std::time::Duration;

              use uuid::Uuid;

              use super::Store;
              use crate::store::NewMemory;

              #[test]
              fn exact_scan_scores_all_active_memories() {
                  let path = test_path();
                  let mut store = Store::open(&path).expect("open test store");
                  let first = remember(&mut store, "first candidate", None);
                  let best = remember(&mut store, "best candidate", Some("legacy-alpha"));
                  let third = remember(&mut store, "third candidate", Some("legacy-beta"));
                  let jobs = store
                      .claim_index_jobs("worker", 3, Duration::from_secs(30))
                      .expect("claim embedding work");
                  for job in jobs {
                      let vector = if job.entity_id == best.id {
                          [1.0, 0.0]
                      } else if job.entity_id == first.id {
                          [0.8, 0.2]
                      } else {
                          assert_eq!(job.entity_id, third.id);
                          [0.5, 0.5]
                      };
                      seed_vector(&store, &job.entity_id, "test-model", &vector, job.generation);
                      store.connection.execute(
                          "DELETE FROM index_jobs WHERE id = ?1",
                          rusqlite::params![job.id],
                      ).expect("consume seeded job");
                  }
                  let hits = store
                      .semantic_search_by_vector(&[2.0, 0.0], "test-model", 10)
                      .expect("search local store");
                  assert_eq!(hits.len(), 3);
                  assert_eq!(hits[0].memory.id, best.id);
                  assert!(hits.iter().any(|hit| hit.memory.id == first.id));
                  assert!(hits.iter().any(|hit| hit.memory.id == third.id));
                  drop(store);
                  cleanup(&path);
              }

              #[test]
              fn coverage_gate_tracks_all_active_memories() {
                  let path = test_path();
                  let mut store = Store::open(&path).expect("open test store");
                  let first = remember(&mut store, "first candidate", None);
                  let second = remember(&mut store, "second candidate", Some("legacy-alpha"));
                  assert!(!store.has_complete_coverage("prod-model").expect("partial gate"));

                  let empty_path = test_path();
                  let empty = Store::open(&empty_path).expect("open empty store");
                  assert!(empty.has_complete_coverage("prod-model").expect("empty gate"));
                  drop(empty);
                  cleanup(&empty_path);

                  let jobs = store
                      .claim_index_jobs("worker", 2, Duration::from_secs(30))
                      .expect("claim embedding work");
                  for job in jobs {
                      seed_vector(&store, &job.entity_id, "prod-model", &[1.0, 0.0], job.generation);
                      store.connection.execute(
                          "DELETE FROM index_jobs WHERE id = ?1",
                          rusqlite::params![job.id],
                      ).expect("consume seeded job");
                  }
                  assert!(store.has_complete_coverage("prod-model").expect("full gate"));
                  assert!(!store.has_complete_coverage("other-model").expect("wrong-model gate"));

                  let fresh = remember(&mut store, "fresh fact", Some("legacy-other"));
                  assert!(!store.has_complete_coverage("prod-model").expect("fresh gate"));
                  let job = store
                      .claim_index_jobs("worker", 1, Duration::from_secs(30))
                      .expect("claim fresh work")
                      .pop()
                      .expect("fresh job");
                  assert_eq!(job.entity_id, fresh.id);
                  seed_vector(&store, &job.entity_id, "prod-model", &[0.0, 1.0], job.generation);
                  store.connection.execute(
                      "DELETE FROM index_jobs WHERE id = ?1",
                      rusqlite::params![job.id],
                  ).expect("consume fresh job");
                  assert!(store.has_complete_coverage("prod-model").expect("restored gate"));

                  store.forget(&fresh.id).expect("delete fresh memory");
                  assert!(store.has_complete_coverage("prod-model").expect("inactive ignored"));
                  let hits = store
                      .semantic_search_by_vector(&[1.0, 0.0], "prod-model", 10)
                      .expect("search still works");
                  assert!(hits.iter().all(|hit| hit.memory.id != fresh.id));
                  assert!(hits.iter().any(|hit| hit.memory.id == first.id));
                  assert!(hits.iter().any(|hit| hit.memory.id == second.id));
                  drop(store);
                  cleanup(&path);
              }

              fn seed_vector(store: &Store, entity_id: &str, model: &str, vector: &[f32], generation: i64) {
                  let mut encoded = Vec::with_capacity(std::mem::size_of_val(vector));
                  for value in vector {
                      encoded.extend_from_slice(&value.to_le_bytes());
                  }
                  store.connection.execute(
                      "INSERT INTO embeddings (
                           entity_type, entity_id, model, dimensions, vector, source_generation, updated_at
                       ) VALUES ('memory', ?1, ?2, ?3, ?4, ?5, 0)
                       ON CONFLICT(entity_type, entity_id, model) DO UPDATE SET
                           dimensions = excluded.dimensions,
                           vector = excluded.vector,
                           source_generation = excluded.source_generation",
                      rusqlite::params![entity_id, model, vector.len() as i64, encoded, generation],
                  ).expect("seed test vector");
              }

              fn remember(store: &mut Store, text: &str, project_id: Option<&str>) -> crate::store::Memory {
                  store.remember(NewMemory {
                      text: text.to_owned(),
                      kind: "fact".to_owned(),
                      project_id: project_id.map(str::to_owned),
                      actor: "agent".to_owned(),
                      source_type: "test".to_owned(),
                      source_ref: None,
                  }).expect("store memory")
              }

              fn test_path() -> std::path::PathBuf {
                  std::env::temp_dir().join(format!("mem-vector-search-test-{}.db", Uuid::now_v7()))
              }

              fn cleanup(path: &std::path::Path) {
                  let _ = std::fs::remove_file(path);
                  let _ = std::fs::remove_file(path.with_extension("db-shm"));
                  let _ = std::fs::remove_file(path.with_extension("db-wal"));
              }
          }
          '''.replace('\n          ', '\n'), text, count=1, flags=re.S)
          assert n == 1
          path.write_text(text)

          # Main CLI: remove project/global knobs; project boundary is the DB location.
          path = Path('src/main.rs')
          text = path.read_text()
          text = text.replace('use anyhow::{Context, Result, bail};', 'use anyhow::{Context, Result};')
          # Remove every public project override field.
          text = re.sub(r'\n    /// Override (?:the )?(?:current )?project identifier\.\n    #\[usage\(long\)\]\n    project: Option<String>,', '', text)
          text = re.sub(r'\n    /// Store user-wide memory instead of project memory\.\n    #\[usage\(long = "global"\)\]\n    global_memory: bool,', '', text)
          text = re.sub(r'\n    /// Search only user-wide global memory\.\n    #\[usage\(long = "global"\)\]\n    global_memory: bool,', '', text)
          text = text.replace('struct ClearStateOutput<\'a> {\n    project_id: &\'a str,\n    workspace_id: &\'a str,\n    cleared: bool,\n}',
                              'struct ClearStateOutput<\'a> {\n    workspace_id: &\'a str,\n    cleared: bool,\n}')
          text = text.replace('    project: Option<ProjectContext>,', '    project: ProjectContext,')

          # All command-local context detection now needs only workspace.
          text = re.sub(
              r'let context =\n\s*project_context\(command\.project\.as_deref\(\), command\.workspace\.as_deref\(\)\)\?;',
              'let context = ProjectContext::detect(command.workspace.as_deref())?;', text)

          # Project command output: no remote-derived identifier.
          text, n = re.subn(
              r'        Command::Project\(command\) => \{.*?\n        \}\n        Command::State',
              '''        Command::Project(command) => {
                  let context = ProjectContext::detect(command.workspace.as_deref())?;
                  if cli.json {
                      print_json(&context)?;
                  } else {
                      if let Some(root) = &context.root {
                          println!("root: {}", root.display());
                      }
                      println!("workspace: {}", context.workspace_id);
                  }
              }
              Command::State'''.replace('\n              ', '\n'), text, count=1, flags=re.S)
          assert n == 1, f'project dispatch {n}'

          text = text.replace('crate::storage::routed_workspace_state(\n                    &router,\n                    &context.project_id,\n                    &context.workspace_id,\n                )?',
                              'crate::storage::routed_workspace_state(&router, &context.workspace_id)?')
          text = text.replace('router.write_store(Some(&context.project_id))?', 'router.write_store()?')
          text = re.sub(r'\n\s*project_id: context\.project_id,', '', text)
          text = text.replace('store.clear_workspace_state(&context.project_id, &context.workspace_id)?',
                              'store.clear_workspace_state(&context.workspace_id)?')
          text = text.replace('                        project_id: &context.project_id,\n', '')
          text = text.replace('"cleared state for {} {}",\n                        context.project_id, context.workspace_id',
                              '"cleared state for {}",\n                        context.workspace_id')
          text = text.replace('"no state for {} {}",\n                        context.project_id, context.workspace_id',
                              '"no state for {}",\n                        context.workspace_id')

          # Context branch becomes single-store + workspace state.
          text, n = re.subn(
              r'        Command::Context\(command\) => \{.*?\n        \}\n        Command::Remember',
              '''        Command::Context(command) => {
                  let project = ProjectContext::detect(command.workspace.as_deref())?;
                  let state = crate::storage::routed_workspace_state(&router, &project.workspace_id)?;
                  let limit = command.limit.unwrap_or(10).clamp(1, 100);
                  let max_bytes = command.max_bytes.unwrap_or(RECALL_DEFAULT_MAX_BYTES);
                  let hits = crate::storage::routed_recall_hits(&router, &command.query, limit)?;
                  let mut memories = Vec::new();
                  let mut total = 0usize;
                  for hit in hits {
                      let text_bytes = hit.memory.text.len();
                      if max_bytes > 0 && !memories.is_empty() && total + text_bytes > max_bytes {
                          break;
                      }
                      total += text_bytes;
                      let (store, id) = crate::storage::routed_resolve_memory(&router, &hit.memory.id)?;
                      let record = store.get(&id)?;
                      memories.push(ContextMemory {
                          memory: record.memory,
