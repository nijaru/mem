                  })?;
                  if cli.json {
                      print_json(&memory)?;
                  } else {
                      println!("{}\t{}\t{}", memory.id, memory.kind, memory.text);
                  }
              }
              Command::Correct'''.replace('\n              ', '\n'), text, count=1, flags=re.S)
          assert n == 1, f'remember branch {n}'
          text = text.replace('crate::storage::routed_resolve_memory(&router, None, &command.id)?',
                              'crate::storage::routed_resolve_memory(&router, &command.id)?')

          # Search no longer chooses a logical scope.
          text, n = re.subn(
              r'        Command::Search\(command\) => \{.*?\n        \}\n        Command::Get',
              '''        Command::Search(command) => {
                  let limit = command.limit.unwrap_or(10).clamp(1, 100);
                  if command.semantic {
                      let cache_dir = model_cache_dir()?;
                      let query_vector = embed_query(&command.query, &cache_dir, !cli.json)?;
                      let hits = crate::storage::routed_semantic_search(
                          &router,
                          &query_vector,
