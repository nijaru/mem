                                  hit.memory.id, hit.memory.kind, hit.score, hit.memory.text
                              );
                          }
                      }
                  } else {
                      let hits = crate::storage::routed_lexical_search(&router, &command.query, limit)?;
                      if cli.json {
                          print_json(&hits)?;
                      } else {
                          for hit in hits {
                              println!("{}\t{}\t{}", hit.memory.id, hit.memory.kind, hit.memory.text);
                          }
                      }
                  }
              }
              Command::Get'''.replace('\n              ', '\n'), text, count=1, flags=re.S)
          assert n == 1, f'search branch {n}'
          text = text.replace('                println!("scope: {}", record.memory.scope);\n                if let Some(project) = &record.memory.project_id {\n                    println!("project: {project}");\n                }\n', '')

          # Index router is single-store; no project probing.
          text = re.sub(
              r'                let context = optional_project_context\(None, None\)\?;\n                let project_id = context\.as_ref\(\)\.map\(\|c\| c\.project_id\.as_str\(\)\);\n                let stats = crate::storage::routed_index_stats\(&router, project_id\)\?;',
              '                let stats = crate::storage::routed_index_stats(&router)?;', text)
          text = re.sub(
              r'                let context = optional_project_context\(None, None\)\?;\n                let project_id = context\.as_ref\(\)\.map\(\|c\| c\.project_id\.as_str\(\)\);\n                let stats = crate::storage::routed_run_index\(\n                    &router,\n                    project_id,\n                    false,\n                    EmbeddingRunOptions \{',
              '                let stats = crate::storage::routed_run_index(\n                    &router,\n                    EmbeddingRunOptions {', text)

          # Remove obsolete project/global resolution helpers and simplify recall.
          text, n = re.subn(r'\nfn optional_project_context\(.*?\n/// Semantic-first recall', '\n/// Semantic-first recall', text, count=1, flags=re.S)
          assert n == 1, f'project helpers {n}'
          text, n = re.subn(
              r'pub fn recall_hits\(\n    store: &Store,\n    query: &str,\n    project_id: Option<&str>,\n    limit: usize,\n    force_lexical: bool,\n\) -> Result<Vec<SearchHit>> \{.*?\n    store\.recall\(query, project_id, limit\)\n\}',
              '''pub fn recall_hits(store: &Store, query: &str, limit: usize) -> Result<Vec<SearchHit>> {
                  if store.has_complete_coverage(EMBEDDING_MODEL_ID)?
                      && let Some(query_vector) = cached_query_vector(query)?
                  {
                      let hits = store.semantic_search_by_vector(
                          &query_vector,
                          EMBEDDING_MODEL_ID,
                          limit,
                      )?;
                      return Ok(hits
                          .into_iter()
                          .filter(|hit| hit.score >= SEMANTIC_CONTEXT_MIN_SCORE)
                          .map(|hit| SearchHit {
                              memory: hit.memory,
                              rank: hit.score,
                          })
                          .collect());
                  }
                  store.recall(query, limit)
              }'''.replace('\n              ', '\n'), text, count=1, flags=re.S)
          assert n == 1, f'recall helper {n}'

          # Human output describes physical project boundary + workspace only.
          text, n = re.subn(
              r'fn print_context\(output: &ContextOutput\) \{.*?\n\}\n\nfn print_workspace_state',
              '''fn print_context(output: &ContextOutput) {
                  if let Some(root) = &output.project.root {
                      println!("root: {}", root.display());
                  }
                  println!("workspace: {}", output.project.workspace_id);
                  if let Some(state) = &output.state {
                      println!("state:");
                      if let Some(session) = &state.last_session_id { println!("  session: {session}"); }
                      if let Some(goal) = &state.active_goal { println!("  goal: {goal}"); }
                      if let Some(task) = &state.active_task_ref { println!("  task: {task}"); }
                      if let Some(checkpoint) = &state.checkpoint { println!("  checkpoint: {checkpoint}"); }
                  }
                  println!("memories:");
                  for item in &output.memories {
                      println!("  {}\t{}\t{}", item.memory.id, item.memory.kind, item.memory.text);
                      for source in &item.sources {
                          let locator = source.locator.as_deref().unwrap_or("-");
                          println!("    source: {} {locator}", source.source_type);
                      }
                  }
              }

              fn print_workspace_state'''.replace('\n              ', '\n'), text, count=1, flags=re.S)
          assert n == 1, f'print context {n}'
          text = text.replace('    println!("project: {}", state.project_id);\n', '')
          text = text.replace('let project = ProjectContext::detect(None, None)?;', 'let project = ProjectContext::detect(None)?;')

          # Replace parser tests with the reduced public surface.
          text, n = re.subn(r'#\[cfg\(test\)\]\nmod cli_parse_tests \{.*\Z', r'''#[cfg(test)]
          mod cli_parse_tests {
              use super::{Command, MemCli, parse_cli};

              fn parse(args: &str) -> MemCli {
                  let argv = std::iter::once("mem".to_owned())
                      .chain(args.split_whitespace().map(str::to_owned))
                      .collect::<Vec<_>>();
                  parse_cli(&argv).expect("parse")
              }

              #[test]
              fn remember_flags_and_defaults() {
                  let cli = parse("remember text-here --kind finding --actor agent --source-type cli --source-ref r");
                  let Command::Remember(command) = &cli.command else { panic!("expected remember"); };
                  assert_eq!(command.text, "text-here");
                  assert_eq!(command.kind.as_deref(), Some("finding"));
                  assert_eq!(command.actor.as_deref(), Some("agent"));
                  assert_eq!(command.source_type.as_deref(), Some("cli"));
                  assert_eq!(command.source_ref.as_deref(), Some("r"));
              }

              #[test]
              fn search_has_one_store_and_optional_semantic_tier() {
                  let cli = parse("search q --semantic -n 3");
                  let Command::Search(command) = &cli.command else { panic!("expected search"); };
                  assert!(command.semantic);
                  assert_eq!(command.limit, Some(3));
              }

              #[test]
              fn state_patch_accepts_repeatable_flags() {
                  let cli = parse("state patch --goal g --session s --task t1 --checkpoint c --clear session --clear goal");
                  let Command::State(state) = &cli.command else { panic!("expected state"); };
                  let super::StateCommand::Patch(patch) = &state.command else { panic!("expected patch"); };
                  assert_eq!(patch.goal.as_deref(), Some("g"));
                  assert_eq!(patch.session.as_deref(), Some("s"));
                  assert_eq!(patch.task.as_deref(), Some("t1"));
                  assert_eq!(patch.checkpoint.as_deref(), Some("c"));
                  assert_eq!(patch.clear, vec!["session".to_owned(), "goal".to_owned()]);
              }
          }
          '''.replace('\n          ', '\n'), text, count=1, flags=re.S)
          assert n == 1
          path.write_text(text)

          # Eval harnesses: all seeds now live in one project DB. Former
          # cross-project negatives become ordinary same-store hard negatives.
          for filename in ['tests/retrieval_eval.rs', 'tests/real_corpus_eval.rs', 'tests/heldout_eval.rs']:
              path = Path(filename)
              text = path.read_text()
              text = re.sub(r'^const PROJECT: &str = .*?;\n', '', text, flags=re.M)
              text = re.sub(r'\n    project: Option<&\'a str>,', '', text)
