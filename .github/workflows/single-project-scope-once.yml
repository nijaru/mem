              text = text.replace('&["search", query, "--project", PROJECT, "-n", &limit]', '&["search", query, "-n", &limit]')
              # Seed writes no longer branch on scope.
              text = re.sub(
                  r'fn remember\(db: &Path, seed: &Seed<\'_>\) -> Value \{.*?\n\}',
                  '''fn remember(db: &Path, seed: &Seed<'_>) -> Value {
                      let args = vec!["remember".to_owned(), seed.text.to_owned()];
