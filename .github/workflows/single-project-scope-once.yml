                  text = re.sub(r'fn remember\(db: &Path, seed: &Seed<\'_>\) -> Value \{.*?\n\}', rich, text, count=1, flags=re.S)
              # remember_text may keep old call shape in tests but ignores the compatibility tag.
              text = re.sub(
                  r'fn remember_text\(db: &Path, text: &str, project: Option<&str>\) -> String \{.*?\n\}',
                  '''fn remember_text(db: &Path, text: &str, _legacy_scope: Option<&str>) -> String {
                      run_json(db, &["remember", text])["id"]
                          .as_str()
                          .expect("id")
                          .to_owned()
                  }'''.replace('\n                  ', '\n'), text, count=1, flags=re.S)
              path.write_text(text)

          # Retrieval/real corpus: delete now-invalid routing distractor seed + leakage assertions.
          for filename in ['tests/retrieval_eval.rs', 'tests/real_corpus_eval.rs']:
              path = Path(filename)
              text = path.read_text()
              text = re.sub(r'\n\s*let (?:other_project_id|distractor_id) = ids.*?;\n', '\n', text, count=1, flags=re.S)
              text = re.sub(r'\n\s*assert!\(\n\s*!\w+\.contains\((?:other_project_id|distractor_id)\),.*?\n\s*\);', '', text, flags=re.S)
              text = re.sub(r'\n\s*Seed \{\n\s*key: "other-project-distractor",.*?\n\s*\},', '', text, count=1, flags=re.S)
              text = text.replace('cross-project distractors from\n// the central agent-context checkout. ', '')
              path.write_text(text)

          # Heldout: remove project-routing leakage checks; retain the conflicting
          # "other-*" statements as genuine same-store semantic hard negatives.
          path = Path('tests/heldout_eval.rs')
          text = path.read_text()
          text = text.replace('multi-project hard negatives with near-duplicate\n// vocabulary,', 'same-store hard negatives with near-duplicate vocabulary,')
          text = text.replace('    let mut leakage_failures = Vec::new();\n', '')
          text = re.sub(r'\n\s*// Hard negatives: same vocabulary family, wrong project\..*?\n\s*\}', '', text, count=1, flags=re.S)
          text = text.replace('    assert!(leakage_failures.is_empty(), "{leakage_failures:?}");\n', '')
          # Remove the explicit other-project containment sub-probe and obsolete helper.
          text = re.sub(r'\n\s*// The poisoned memory itself is retrievable.*?cross-project id \{other\}"\n\s*\);', '', text, count=1, flags=re.S)
          text = re.sub(r'\nfn other_project_visible\(.*?\n\}\n', '\n', text, count=1, flags=re.S)
          text = re.sub(r'\nfn is_hard_negative\(.*?\n\}\n', '\n', text, count=1, flags=re.S)
          text = text.replace('// Hard negative pairs: same vocabulary, wrong project. Targets and\n// their negatives are listed as (target, negative) pairs.\n', '')
          path.write_text(text)
          PY

          cargo fmt --all
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo build --release
          git diff --check
      - name: Commit verified scope collapse
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/single-project-scope-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: collapse logical project scope"
          git pull --rebase origin main
          git push origin HEAD:main
