name: single-project-scope-final-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/single-project-scope-final-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run scope collapse with final eval helper
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /- name: Run corrected scope collapse/ { found=1; next }
            found && /run: \|/ { capture=1; next }
            capture && /^      - name: Commit verified scope collapse/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/single-project-scope-retry-once.yml > /tmp/run-scope.sh

          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/run-scope.sh')
          text = path.read_text()
          needle = 'cargo fmt --all\n'
          assert needle in text, 'verification boundary not found'
          helper_lines = [
              "python3 - <<'PY2'",
              "from pathlib import Path",
              "",
              "path = Path('src/index_job.rs')",
              "text = path.read_text()",
              "text = text.replace(",
              "    'assert_eq!(store.stats().expect(\\\"read stats\\\").schema_version, 5);',",
              "    'assert_eq!(store.stats().expect(\\\"read stats\\\").schema_version, 6);',",
              ")",
              "path.write_text(text)",
              "",
              "path = Path('tests/real_corpus_eval.rs')",
              "text = path.read_text()",
              "if 'fn context_ids(db: &Path, query: &str, lexical: bool)' not in text:",
              "    marker = 'fn semantic_ids(db: &Path, query: &str) -> Vec<String> {'",
              "    assert marker in text, 'real corpus semantic helper missing'",
              "    helper = '\\n'.join([",
              "        'fn context_ids(db: &Path, query: &str, lexical: bool) -> Vec<String> {',",
              "        '    if lexical {',",
              "        '        return lexical_ids(db, query);',",
              "        '    }',",
              "        '    let limit = LIMIT.to_string();',",
              "        '    run_json(',",
              "        '        db,',",
              "        '        &[',",
              "        '            \\\"context\\\",',",
              "        '            query,',",
              "        '            \\\"--workspace\\\",',",
              "        '            WORKSPACE,',",
              "        '            \\\"-n\\\",',",
              "        '            limit.as_str(),',",
              "        '        ],',",
              "        '    )[\\\"memories\\\"]',",
              "        '        .as_array()',",
              "        '        .expect(\\\"context memories array\\\")',",
              "        '        .iter()',",
              "        '        .map(|item| {',",
              "        '            item[\\\"memory\\\"][\\\"id\\\"]',",
              "        '                .as_str()',",
              "        '                .expect(\\\"context memory ID\\\")',",
              "        '                .to_owned()',",
              "        '        })',",
              "        '        .collect()',",
              "        '}',",
              "        '',",
              "    ])",
              "    text = text.replace(marker, helper + marker, 1)",
              "path.write_text(text)",
              "PY2",
              "",
          ]
          helper_patch = '\n'.join(helper_lines)
          path.write_text(text.replace(needle, helper_patch + needle, 1))
          PY

          bash /tmp/run-scope.sh
      - name: Commit verified scope collapse
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/single-project-scope-once.yml
          rm .github/workflows/single-project-scope-retry-once.yml
          rm .github/workflows/single-project-scope-final-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: collapse logical project scope"
          git pull --rebase origin main
          git push origin HEAD:main
