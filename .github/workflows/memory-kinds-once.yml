name: memory-kinds-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/memory-kinds-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply memory model cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          store = Path('src/store.rs')
          text = store.read_text()
          old = 'const MEMORY_KINDS: &[&str] = &["fact", "decision", "constraint", "preference", "procedure"];'
          new = 'const MEMORY_KINDS: &[&str] = &["fact", "finding", "decision", "constraint", "preference", "procedure"];'
          assert old in text
          store.write_text(text.replace(old, new, 1))

          main = Path('src/main.rs')
          text = main.read_text()
          old_help = '    /// Memory kind: fact, decision, constraint, preference, or procedure.\n'
          new_help = '    /// Memory kind: fact, finding, decision, constraint, preference, or procedure.\n'
          assert old_help in text
          text = text.replace(old_help, new_help, 1)
          old_actor = 'command.actor.unwrap_or_else(|| "user".to_owned())'
          count = text.count(old_actor)
          assert count == 2, count
          text = text.replace(old_actor, 'command.actor.unwrap_or_else(|| "agent".to_owned())')
          main.write_text(text)
          PY
          cargo fmt --all
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          git diff --check
      - name: Commit verified cleanup
        shell: bash
        run: |
          rm .github/workflows/memory-kinds-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: add finding memory kind and honest actor default"
          git pull --rebase origin main
          git push origin HEAD:main
