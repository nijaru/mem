name: patch-verifier

on:
  push:
    branches:
      - agent/lean-core
    paths:
      - .github/workflows/patch-verifier.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Replace brittle migration patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/lean-core-verify.yml')
          text = path.read_text()
          start = text.index("          old = '''    fn migrate(&self) -> Result<()> {")
          end = text.index("\n\n          Path('tests/retrieval_eval.rs')", start)
          replacement = """          start = text.index(\"    fn migrate(&self) -> Result<()> {\")
          end = text.index(\"    fn schema_version(&self) -> Result<i64> {\", start)
          replacement = r'''    fn migrate(&self) -> Result<()> {
              self.connection.execute_batch(\"BEGIN IMMEDIATE;\")?;
              let result = (|| -> Result<()> {
                  let version = self.schema_version()?;
                  if version > SCHEMA_VERSION {
                      bail!(
                          \"database schema version {version} is newer than supported version {SCHEMA_VERSION}\"
                      );
                  }
                  match version {
                      0 => self.connection.execute_batch(include_str!(\"../migrations/schema.sql\"))?,
                      6 => self
                          .connection
                          .execute_batch(include_str!(\"../migrations/0007_lean_core.sql\"))?,
                      7 => {}
                      1..=5 => bail!(
                          \"database schema version {version} is from an unsupported pre-1.0 build; upgrade it to v6 with the previous mem build first\"
                      ),
                      _ => unreachable!(),
                  }
                  let version = self.schema_version()?;
                  if version != SCHEMA_VERSION {
                      bail!(\"failed to migrate database to schema version {SCHEMA_VERSION}; got {version}\");
                  }
                  Ok(())
              })();
              match result {
                  Ok(()) => {
                      self.connection.execute_batch(\"COMMIT;\")?;
                      Ok(())
                  }
                  Err(error) => {
                      let _ = self.connection.execute_batch(\"ROLLBACK;\");
                      Err(error)
                  }
              }
          }

          '''
          path.write_text(text[:start] + replacement + text[end:])"""
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Commit verifier patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-verifier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: make lean verifier patch robust"
          git pull --rebase origin agent/lean-core
          git push origin HEAD:agent/lean-core
