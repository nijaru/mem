name: prune-episodes-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-episodes-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Remove episodic history surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/main.rs')
          text = path.read_text()
          text = text.replace('mod episode;\n', '')
          text = text.replace('use crate::episode::{NewEpisode, NewEpisodeEntry};\n', '')
          text = text.replace('    Episode(EpisodeCommand),\n    History(History),\n', '')
          text = text.replace(
              '        Command::Episode(episode) => !matches!(&episode.command, EpisodeSubcommand::Get(_)),\n',
              '',
          )

          text, n = re.subn(
              r'\n/// Record and inspect episodic source history\..*?\n/// Operate the durable derived-index work queue\.',
              '\n/// Operate the durable derived-index work queue.', text, count=1, flags=re.S)
          assert n == 1, f'episode CLI type block removal: {n}'
          text, n = re.subn(
              r'\n        Command::Episode\(command\) => match command\.command \{.*?\n        Command::Index\(command\) => match command\.command \{',
              '\n        Command::Index(command) => match command.command {', text, count=1, flags=re.S)
          assert n == 1, f'episode/history dispatch removal: {n}'
          text, n = re.subn(
              r'\nfn episode_context\(.*?\n\}\n\nfn memory_project',
              '\nfn memory_project', text, count=1, flags=re.S)
          assert n == 1, f'episode_context removal: {n}'
          text, n = re.subn(
              r'\nfn print_episode\(.*?\n\}\n\nfn print_workspace_state',
              '\nfn print_workspace_state', text, count=1, flags=re.S)
          assert n == 1, f'print_episode removal: {n}'

          test_fn = re.compile(r'\n    #\[test\]\n    fn [A-Za-z0-9_]+\(\) \{.*?\n    \}', re.S)
          chunks, last = [], 0
          for m in test_fn.finditer(text):
              body = m.group(0)
              if ('Episode' in body or 'History' in body or 'episode ' in body or 'history ' in body):
                  chunks.append(text[last:m.start()])
                  last = m.end()
          if chunks:
              chunks.append(text[last:])
              text = ''.join(chunks)
          path.write_text(text)

          path = Path('src/storage.rs')
          text = path.read_text().replace('use crate::episode::HistoryHit;\n', '')
          text, n = re.subn(
              r'\npub fn routed_resolve_episode\(.*?\n\}\n\nfn resolve_id',
              '\nfn resolve_id', text, count=1, flags=re.S)
          assert n == 1
          text, n = re.subn(
              r'\npub fn routed_history_search\(.*?\n\}\n\npub fn routed_workspace_state',
              '\npub fn routed_workspace_state', text, count=1, flags=re.S)
          assert n == 1
          path.write_text(text)

          path = Path('src/id_resolve.rs')
          text = path.read_text()
          text = text.replace(
              '//! One implementation so memories and episodes cannot drift apart on the\n//! same rules — the duplicated builders previously produced paired defects\n//! (unescaped LIKE prefixes, divergent AND/OR joining).\n',
              '//! Memory ID prefix resolution and FTS query construction share the same\n//! literal-prefix escaping rules.\n')
          text, n = re.subn(
              r'\n    /// Episode IDs matching an exact ID or prefix, for routed resolution\..*?\n    \}\n',
              '\n', text, count=1, flags=re.S)
          assert n == 1
          text, n = re.subn(
              r'\n    pub\(crate\) fn resolve_episode_id\(.*?\n    \}\n',
              '\n', text, count=1, flags=re.S)
          assert n == 1

          replacement = r'''    #[test]
    fn wildcards_in_memory_prefixes_match_literally() {
        let path = test_path();
        let mut store = Store::open(&path).expect("open store");
        store
            .remember(super::super::store::NewMemory {
                text: "literal wildcard memory".to_owned(),
                kind: "fact".to_owned(),
                project_id: None,
                actor: "agent".to_owned(),
                source_type: "test".to_owned(),
                source_ref: None,
            })
            .expect("seed memory");

        for wildcard in ["_", "%", "\\"] {
            assert!(
                store.get(wildcard).is_err(),
                "memory wildcard {wildcard:?} must not resolve"
            );
        }
        let ids = store.memory_id_candidates("01").expect("memory candidates");
        assert!(!ids.is_empty(), "real prefix must match");
        let _ = std::fs::remove_file(&path);
    }

    #[test]
    fn exact_id_wins_over_ambiguity'''
          text, n = re.subn(
              r'    #\[test\]\n    fn wildcards_in_prefixes_match_literally_for_both_entities\(\) \{.*?\n    \}\n\n    #\[test\]\n    fn exact_id_wins_over_ambiguity',
              lambda _: replacement, text, count=1, flags=re.S)
          assert n == 1
          path.write_text(text)
          PY

          rm src/episode.rs
          ! grep -R "crate::episode\|Command::Episode\|Command::History\|EpisodeSubcommand\|routed_history_search\|routed_resolve_episode\|resolve_episode_id\|episode_id_candidates" src --include='*.rs'

          cargo fmt --all
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo build --release
          git diff --check
      - name: Commit verified prune
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prune-episodes-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove episodic history surface"
          git pull --rebase origin main
          git push origin HEAD:main
