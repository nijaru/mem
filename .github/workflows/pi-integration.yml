name: pi-integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pi-integration.yml
      - integrations/pi/**

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: integrations/pi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock-only && npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
