name: context-surface-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/context-surface-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Remove retrieval-mode choice from context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/main.rs')
          text = path.read_text()
          text, n = re.subn(r'\n    /// Force FTS5 lexical recall instead of semantic-first ranking\.\n    #\[usage\(long\)\]\n    lexical: bool,', '', text, count=1)
          assert n == 1
          dispatch = '                command.lexical,\n'
          assert dispatch in text
          text = text.replace(dispatch, '                false,\n', 1)
          test_fn = re.compile(r'\n    #\[test\]\n    fn [A-Za-z0-9_]+\(\) \{.*?\n    \}', re.S)
          out, last = [], 0
          for m in test_fn.finditer(text):
              body = m.group(0)
              if '--lexical' in body or '.lexical' in body:
                  out.append(text[last:m.start()])
                  last = m.end()
          if out:
              out.append(text[last:])
              text = ''.join(out)
          path.write_text(text)

          lexical_fn = '\n'.join([
              'fn lexical_ids(db: &Path, query: &str) -> Vec<String> {',
              '    let limit = LIMIT.to_string();',
              '    let output = run_json(db, &["search", query, "--project", PROJECT, "-n", &limit]);',
              '    output',
              '        .as_array()',
              '        .expect("lexical search array")',
              '        .iter()',
              '        .map(|item| item["memory"]["id"].as_str().expect("id").to_owned())',
              '        .collect()',
              '}',
              '',
          ])
          for filename in ['tests/heldout_eval.rs', 'tests/real_corpus_eval.rs', 'tests/retrieval_eval.rs']:
              path = Path(filename)
              text = path.read_text()
              text = text.replace('    if lexical {\n        args.push("--lexical".to_owned());\n    }\n', '    if lexical {\n        return lexical_ids(db, query);\n    }\n')
              text = text.replace('    if lexical {\n        args.push("--lexical");\n    }\n', '    if lexical {\n        return lexical_ids(db, query);\n    }\n')
              marker = 'fn semantic_ids(db: &Path, query: &str) -> Vec<String> {'
              assert marker in text, filename
              if 'fn lexical_ids(db: &Path, query: &str)' not in text:
                  text = text.replace(marker, lexical_fn + marker, 1)
              path.write_text(text)
          PY

          cargo clippy --fix --allow-dirty --allow-staged --all-targets -- -D warnings || true
          cargo fmt --all
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo build --release
          git diff --check
      - name: Commit verified context surface
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/context-surface-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: make context retrieval mode automatic"
          git pull --rebase origin main
          git push origin HEAD:main
